<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>直問！ 毎日10問</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@500;800&family=Noto+Sans+JP:wght@400;700&display=swap">
<style>
/* layout: phone-first single column; sticky day strip; page images stacked like a printed handout */
:root{--ink:#1B2742;--accent:#EE6224;--paper:#F7F3EC;--card:#FFFFFF;--line:#E2DCD2;--muted:#6B6458;
--display:"M PLUS 1p","Hiragino Sans","Noto Sans JP",sans-serif;--body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;color-scheme:light}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.wrap{max-width:720px;margin:0 auto}
header{display:flex;flex-direction:column;gap:6px;padding-block:22px 14px}
.brand{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;letter-spacing:.02em;color:var(--accent)}
.brand small{display:block;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.12em;margin-bottom:6px}
.target{align-self:flex-start;background:var(--ink);color:#fff;border-radius:999px;padding:4px 14px;font-size:13px;font-weight:700}
.target b{color:var(--accent)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;border-bottom:1px solid var(--line)}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.days a{display:block;text-align:center;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);
border-radius:8px;padding:6px 0;font-family:var(--display);font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.days a[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.days a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.head{display:flex;flex-direction:column;gap:2px;padding-block:18px 10px}
.head h1{font-family:var(--display);font-size:24px;margin:0;text-wrap:balance}
.head p{margin:0;color:var(--muted);font-size:13px}
.how{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13.5px;margin-block:0 14px}
.how ol{margin:4px 0 0;padding-left:1.3em}
.pages{display:flex;flex-direction:column;gap:12px}
.pages img{width:100%;height:auto;display:block;background:#fff;border:1px solid var(--line);border-radius:4px}
.nextday{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.nextday a{flex:1;text-align:center;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;font-weight:700}
footer{margin-top:26px;font-size:11.5px;color:var(--muted);line-height:1.6}
@media (prefers-reduced-motion:no-preference){.pages img{animation:none}}
</style>
<style>*{box-sizing:border-box}img{max-width:100%}</style>
</head>
<body>

<div class="wrap">
<header>
  <div class="brand"><small>CHOKUMON</small>直問！</div>
  <div class="target">TOEIC <b>730点</b>をめざす人へ</div>
</header>
<nav aria-label="Day"><div class="days" id="days"></div></nav>
<section>
  <div class="head"><h1 id="t">Day 1</h1><p id="s"></p></div>
  <div class="how"><b>使い方</b><ol><li>1ページ目の10問を、1問20秒で解く（答えはメモ）</li><li>次のページから答え合わせ。空欄でどんな「問い」を立てるかを読む</li><li>まちがえた問題は、英文を前から声に出して読む</li></ol></div>
  <div class="pages" id="pages"></div>
  <div class="nextday" id="nav2"></div>
</section>
<footer>TOEICはETSの登録商標です。このページの問題はすべてオリジナルで、ETSの承認を受けたものではありません。レベルの目安は推定です。</footer>
</div>
<script>
const D={"pages": {"1": ["p/d01-01.jpg", "p/d01-02.jpg", "p/d01-03.jpg", "p/d01-04.jpg", "p/d01-05.jpg", "p/d01-06.jpg", "p/d01-07.jpg", "p/d01-08.jpg", "p/d01-09.jpg", "p/d01-10.jpg", "p/d01-11.jpg", "p/d01-12.jpg"], "2": ["p/d02-1.jpg", "p/d02-2.jpg", "p/d02-3.jpg", "p/d02-4.jpg", "p/d02-5.jpg", "p/d02-6.jpg", "p/d02-7.jpg", "p/d02-8.jpg"], "3": ["p/d03-01.jpg", "p/d03-02.jpg", "p/d03-03.jpg", "p/d03-04.jpg", "p/d03-05.jpg", "p/d03-06.jpg", "p/d03-07.jpg", "p/d03-08.jpg", "p/d03-09.jpg", "p/d03-10.jpg", "p/d03-11.jpg"], "4": ["p/d04-01.jpg", "p/d04-02.jpg", "p/d04-03.jpg", "p/d04-04.jpg", "p/d04-05.jpg", "p/d04-06.jpg", "p/d04-07.jpg", "p/d04-08.jpg", "p/d04-09.jpg", "p/d04-10.jpg", "p/d04-11.jpg", "p/d04-12.jpg"], "5": ["p/d05-01.jpg", "p/d05-02.jpg", "p/d05-03.jpg", "p/d05-04.jpg", "p/d05-05.jpg", "p/d05-06.jpg", "p/d05-07.jpg", "p/d05-08.jpg", "p/d05-09.jpg", "p/d05-10.jpg", "p/d05-11.jpg", "p/d05-12.jpg"], "6": ["p/d06-01.jpg", "p/d06-02.jpg", "p/d06-03.jpg", "p/d06-04.jpg", "p/d06-05.jpg", "p/d06-06.jpg", "p/d06-07.jpg", "p/d06-08.jpg", "p/d06-09.jpg", "p/d06-10.jpg", "p/d06-11.jpg", "p/d06-12.jpg"], "7": ["p/d07-01.jpg", "p/d07-02.jpg", "p/d07-03.jpg", "p/d07-04.jpg", "p/d07-05.jpg", "p/d07-06.jpg", "p/d07-07.jpg", "p/d07-08.jpg", "p/d07-09.jpg", "p/d07-10.jpg", "p/d07-11.jpg", "p/d07-12.jpg"], "8": ["p/d08-01.jpg", "p/d08-02.jpg", "p/d08-03.jpg", "p/d08-04.jpg", "p/d08-05.jpg", "p/d08-06.jpg", "p/d08-07.jpg", "p/d08-08.jpg", "p/d08-09.jpg", "p/d08-10.jpg", "p/d08-11.jpg", "p/d08-12.jpg"], "9": ["p/d09-01.jpg", "p/d09-02.jpg", "p/d09-03.jpg", "p/d09-04.jpg", "p/d09-05.jpg", "p/d09-06.jpg", "p/d09-07.jpg", "p/d09-08.jpg", "p/d09-09.jpg", "p/d09-10.jpg", "p/d09-11.jpg", "p/d09-12.jpg"], "10": ["p/d10-01.jpg", "p/d10-02.jpg", "p/d10-03.jpg", "p/d10-04.jpg", "p/d10-05.jpg", "p/d10-06.jpg", "p/d10-07.jpg", "p/d10-08.jpg", "p/d10-09.jpg", "p/d10-10.jpg", "p/d10-11.jpg", "p/d10-12.jpg"]}, "subs": {"1": "空欄の後ろは「完成」？「穴あり」？", "2": "空欄に立つ「問い」で品詞を決める", "3": "「いつの話？」で時制を決める", "4": "主語は「する側？される側？」", "5": "「だれが？何が？」を先に決める", "6": "空欄の後ろは「文？名詞？」", "7": "1週目の振り返り　6つの問いを使い分ける", "8": "穴は「だれが？」「だれを？」「だれの？」", "9": "名詞は「する側？」「される側？」", "10": "空欄の前の言葉は、to？ -ing？ どっちを呼ぶ？"}, "lv": {"1": "550〜800", "2": "400〜550", "3": "500〜700", "4": "500〜750", "5": "550〜750", "6": "500〜700", "7": "500〜600", "8": "550〜850", "9": "500〜650", "10": "500〜750"}};
const days=document.getElementById('days'),pages=document.getElementById('pages');
for(let d=1;d<=10;d++){const a=document.createElement('a');a.href='#day'+d;a.textContent=d;a.dataset.d=d;a.setAttribute('aria-label','Day '+d);days.appendChild(a);}
function show(){const m=(location.hash||'').match(/^#day(\d+)$/);let d=m?+m[1]:1;if(!D.pages[d])d=1;
 document.getElementById('t').textContent='Day '+d;
 document.getElementById('s').textContent=D.subs[d]+'　｜　レベルの目安 '+D.lv[d]+'点';
 days.querySelectorAll('a').forEach(a=>a.setAttribute('aria-current',+a.dataset.d===d?'true':'false'));
 pages.innerHTML='';D.pages[d].forEach((src,i)=>{const im=new Image();im.src=src;im.alt='Day '+d+' '+(i+1)+'ページ';im.loading=i<2?'eager':'lazy';im.width=910;im.height=1287;pages.appendChild(im);});
 const n2=document.getElementById('nav2');n2.innerHTML='';
 if(d>1){const a=document.createElement('a');a.href='#day'+(d-1);a.textContent='← Day '+(d-1);n2.appendChild(a);}
 if(d<10){const a=document.createElement('a');a.href='#day'+(d+1);a.textContent='Day '+(d+1)+' →';n2.appendChild(a);}
 window.scrollTo(0,0);}
addEventListener('hashchange',show);show();
</script>

</body>
</html>
