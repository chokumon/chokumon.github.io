<!doctype html>
<html lang="ja">
<head>

<title>ページが見つかりません｜直問！</title>

:root{--q:#FF6A1A}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#000;color:#F5F5F5;font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;padding:24px;box-sizing:border-box}

.m{background:var(--q);color:#000}.s{border:1px solid #2B2B2B;color:#F5F5F5}

<main>
