<style>
/* matches the landing page: midnight ground, cyan = reading beam, orange = the question / CTA */
:root{--bg:#000000;--panel:#121212;--edge:#2B2B2B;--ink:#F5F5F5;--mute:#A6A6A6;--scan:#FF6A1A;--q:#FF6A1A;

body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--jp);font-size:15px;line-height:1.75;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:16px 12px}
.brand{font-weight:900;font-size:24px;line-height:1;letter-spacing:.06em;color:var(--ink);text-decoration:none}
.brand i{font-style:normal;color:var(--q);margin-left:-.12em}
.toplan{font-size:13px;font-weight:700;color:#fff;background:var(--q);border-radius:999px;padding:7px 14px;text-decoration:none;box-shadow:0 6px 18px -8px rgba(255,106,26,.8)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(0,0,0,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-block:10px;border-bottom:1px solid rgba(255,106,26,.14)}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.days a{display:block;text-align:center;text-decoration:none;color:var(--mute);background:var(--panel);border:1px solid var(--edge);
border-radius:10px;padding:7px 0;font-family:var(--en);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.days a[aria-current="true"]{background:rgba(255,106,26,.14);border-color:var(--scan);color:#fff;box-shadow:0 0 0 1px var(--scan) inset}
.days a:focus-visible{outline:2px solid var(--scan);outline-offset:2px}
.head{display:flex;flex-direction:column;gap:2px;padding-block:20px 12px}
.head h1{font-family:var(--en);font-weight:700;font-size:28px;margin:0;letter-spacing:.01em}
.head p{margin:0;color:var(--mute);font-size:13px}
.how{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:12px 16px;font-size:13.5px;margin-block:0 16px;color:var(--mute)}
.how b{color:var(--ink)}
.how ol{margin:4px 0 0;padding-left:1.3em}
.pages{display:flex;flex-direction:column;gap:14px}
.pages img{width:100%;height:auto;display:block;background:#fff;border-radius:10px;box-shadow:0 18px 40px -24px rgba(0,0,0,.9)}
.nextday{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.nextday a{flex:1;text-align:center;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:12px;font-weight:700;font-family:var(--en)}
.cta{margin-top:22px;border-radius:16px;padding:18px;background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(135deg,var(--q),rgba(255,106,26,.6)) border-box;border:1px solid transparent}
.cta b{display:block;font-size:16px}
.cta p{margin:4px 0 12px;color:var(--mute);font-size:13.5px}
.cta a{display:block;text-align:center;background:var(--q);color:#fff;text-decoration:none;font-weight:700;border-radius:12px;padding:12px}
footer{margin-top:26px;font-size:11.5px;color:var(--mute);line-height:1.6}
</style>
<style>*{box-sizing:border-box}img{max-width:100%}</style>

</header>
<nav aria-label="Day"><div class="days" id="days"></div></nav>
<section>
  <div class="head"><h1 id="t">Day 1</h1><p id="s"></p></div>
  <div class="how"><b>使い方</b><ol><li>1ページ目の10問を、1問20秒で解く（答えはメモ）</li><li>次のページから答え合わせ。空欄でどんな「問い」を立てるかを読む</li><li>まちがえた問題は、英文を前から声に出して読む</li></ol></div>
  <div class="pages" id="pages"></div>
  <div class="nextday" id="nav2"></div>
  <div class="cta"><b>Day 11 からは月額プランで</b><p>毎日の練習問題と音読音声つき解説（準備中）</p><a href="../#plan">月額プランを見る</a></div>
</section>
<footer>TOEICはETSの登録商標です。このページの問題はすべてオリジナルで、ETSの承認を受けたものではありません。レベルの目安は推定です。</footer>
</div>
